<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>RandomQuote</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SleepKnight8/SleepKnight8_Themes/themes.css">
    <link rel="stylesheet" href="style.css">

</head>


<body class="sk-yellow">
    <div class="theme-switch">

        <button
            id="yellowMode"
            onclick="setTheme('yellow')">
            🟡
        </button>

        <button
            id="purpleMode"
            onclick="setTheme('purple')">
            🟣
        </button>
    </div>

    <h1>RandomQuote</h1>


    <div id="quote-container">

        <div id="quotetext-container">

            <h2 id="quote">
                Lorem ipsum dolor sit amet,
                consectetur adipisicing elit.
            </h2>

        </div>


        <div id="author-container">

            <h3 id="author">
                Bob
            </h3>

        </div>

    </div>


    <br>


    <div id="buttons-container">

        <button
            id="new-quote-button"
            onclick="RandomQuote()">

            New Quote

        </button>

    </div>


    <div id="QuoteProgress">

        <h3 id="quote-progress-text">

            Quote Explored:
            0/1454 (0%)

        </h3>

    </div>


    <h2>
        The Best Developer
    </h2>


    <a
        href="https://github.com/SleepKnight8"
        class="logo"
        target="_blank">

        SleepKnight8

    </a>


    <p id="copyright">
        © 2026 SleepKnight8. All rights reserved.
    </p>

    <script src="https://cdn.jsdelivr.net/gh/SleepKnight8/SleepKnight8_Themes/themes.js"></script>
    <script src="index.js"></script>

</body>

</html>
